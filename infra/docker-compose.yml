# Local stack. Profiles: core (this step), obs and orchestration (added in later steps).
# Every image is pinned by tag AND digest (NFR-07, ADR-0001). Ports bind to 127.0.0.1 only (spec 06).
name: ptp

services:
  kafka:
    profiles: ["core"]
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    hostname: kafka
    environment:
      CLUSTER_ID: "cHRwLWxvY2FsLWNsdXN0ZXI"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # Containers use kafka:9092; tools on the host use localhost:29092.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created only by kafka-init (FR-ING-02).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: internal topics cannot be replicated. Production needs RF=3 (spec 04, NFR-03).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  kafka-init:
    profiles: ["core"]
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_HEAP_OPTS: "-Xmx256m"
    volumes:
      - ./kafka/create-topics.sh:/opt/ptp/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/ptp/create-topics.sh"]
    restart: "no"

  postgres:
    profiles: ["core"]
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptp}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-ptp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set in .env (run make env)}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/opt/ptp:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  pg-migrate:
    profiles: ["core"]
    image: flyway/flyway:13.10.3@sha256:ad074befe29dc4151b7f61be741dc13d1c3d4e5e76fc59681c026108b54bdebe
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ptp}
      FLYWAY_USER: ptp_migrator
      FLYWAY_PASSWORD: ${PTP_MIGRATOR_PASSWORD:?run make env}
      # History table lives in ops; Flyway creates the listed schemas as ptp_migrator.
      FLYWAY_SCHEMAS: ops,tracking,analytics
      FLYWAY_DEFAULT_SCHEMA: ops
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ../sql/postgres/migrations:/flyway/sql:ro
    command: ["migrate"]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512m

  # The status processor + bronze writer as a container (AC-7.6). Build the image first: `make image`.
  spark-processor:
    profiles: ["stream"]
    image: ptp-jobs:local  # built locally from infra/jobs/Dockerfile (pinned base); see `make image`
    init: true             # forwards SIGTERM to the JVM for a graceful stop
    command: ["processor"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ptp}
      PTP_STREAM_WRITER_PASSWORD: ${PTP_STREAM_WRITER_PASSWORD:?run make env}
      LAKE_ROOT: ${PTP_HOST_DATA_DIR:?run make env}/lake          # same absolute path as on the host (see .env.example)
      CHECKPOINT_ROOT: ${PTP_HOST_DATA_DIR:?run make env}/checkpoints
      TRIGGER_INTERVAL_SECONDS: ${TRIGGER_INTERVAL_SECONDS:-5}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-50000}
      DRIVER_MEMORY: 2g
      METRICS_PORT: 9464   # scraped by Prometheus on the Compose network; not published on the host
    volumes:
      - ${PTP_HOST_DATA_DIR:?run make env}:${PTP_HOST_DATA_DIR:?run make env}
    stop_grace_period: 60s
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 3g

  # Docker API for Airflow's DockerOperator, restricted (ADR-0009). Never published on a host port.
  docker-proxy:
    profiles: ["orchestration"]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: 1   # create/start/wait/logs/remove job containers
      IMAGES: 1       # DockerOperator checks that the image exists before starting it
      POST: 1         # write methods, for the sections enabled above only
      # Everything else (exec, volumes, networks, swarm, system, …) stays denied by the proxy's defaults.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

  # Airflow 3 (ADR-0008): one container (`standalone`, LocalExecutor), metadata in its own Postgres database.
  airflow:
    profiles: ["orchestration"]
    image: apache/airflow:3.3.2-python3.12@sha256:9df9c8be4096b9cc626bd7cb1f2b8c712eef66c59c615f8c7e6200871ca10bd1
    command: ["standalone"]
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ptp_airflow:${PTP_AIRFLOW_PASSWORD:?run make env}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"   # schedules start only when a DAG is unpaused
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      # Read by the DAGs (orchestration/airflow/dags/ptp_common.py).
      PTP_JOBS_IMAGE: ptp-jobs:local
      PTP_DOCKER_URL: tcp://docker-proxy:2375
      PTP_DOCKER_NETWORK: ptp_default
      PTP_HOST_DATA_DIR: ${PTP_HOST_DATA_DIR:?run make env}   # absolute path of ./data (from .env)
      POSTGRES_DB: ${POSTGRES_DB:-ptp}
      PTP_BATCH_WRITER_PASSWORD: ${PTP_BATCH_WRITER_PASSWORD:?run make env}
      PTP_STREAM_WRITER_PASSWORD: ${PTP_STREAM_WRITER_PASSWORD:?run make env}
      BRONZE_RETENTION_DAYS: ${BRONZE_RETENTION_DAYS:-90}
      SILVER_RETENTION_DAYS: ${SILVER_RETENTION_DAYS:-400}
      PROCESSED_EVENTS_RETENTION_DAYS: ${PROCESSED_EVENTS_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../orchestration/airflow/dags:/opt/airflow/dags:ro
      - ../orchestration/airflow/checks:/opt/airflow/checks:ro
      - ../data/airflow/auth:/opt/airflow/auth
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  # Observability (SC-0007): all bound to 127.0.0.1.
  pushgateway:
    profiles: ["obs"]
    image: prom/pushgateway:v1.11.4@sha256:91a56b89b97dd8a5e1e4fa8b5bbbd86dd57a87a2a3cee3a3ce3368b40ef158ef
    ports:
      - "127.0.0.1:9091:9091"
    deploy:
      resources:
        limits:
          memory: 64m

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # scrape `make process` on the host
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"     # no usage reporting
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      POSTGRES_DB: ${POSTGRES_DB:-ptp}
      PTP_READER_PASSWORD: ${PTP_READER_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 18
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  airflow-logs:
  grafana-data:
  prometheus-data:
  kafka-data:
  postgres-data:
