apiVersion: 1
datasources:
  - name: Prometheus
    uid: ptp-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: PTP Postgres (read-only)
    uid: ptp-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ptp_reader          # SELECT on analytics, tracking and the ops run logs only (V3, V7)
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: ${PTP_READER_PASSWORD}
