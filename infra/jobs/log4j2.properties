# Runtime logging for `make process`. Spark at WARN; ptp.events lines are pure JSON (FR-OBS-02).
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr
appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{HH:mm:ss.SSS} %p %c{1}: %m%n

appender.json.type = Console
appender.json.name = json
appender.json.target = SYSTEM_OUT
appender.json.layout.type = PatternLayout
appender.json.layout.pattern = %m%n
logger.events.name = ptp.events
logger.events.level = info
logger.events.additivity = false
logger.events.appenderRef.json.ref = json
