# Keep test output readable: Spark logs at WARN, project code at INFO.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %p %c{1}: %m%n
logger.ptp.name = ptp
logger.ptp.level = info
# A topic created seconds earlier can briefly report stale leadership; the idempotent producer retries.
logger.kafkaSender.name = org.apache.kafka.clients.producer.internals.Sender
logger.kafkaSender.level = error
