# CI for every push and PR (FR-DEV-02, AC-0.8). Actions are pinned to commit SHAs (NFR-07).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: pins, secrets, python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check pins
        run: make check-pins
      - name: Secret scan
        run: make secrets-scan
      - name: Lint and Python tests
        run: make lint test-py

  scala:
    name: scala + spark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@2d56c68508d12eef34cb068bac1c8e7f9523bbd9 # v1.5.12
      - name: Scala tests
        run: make test-scala

  stack:
    name: compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Start core stack
        run: make up
      - name: Verify stack
        run: make verify
      - name: Integration tests (generator -> Kafka)
        run: make test-it-py
      - name: Logs on failure
        if: failure()
        run: docker compose --project-directory infra -f infra/docker-compose.yml --env-file .env --profile core logs --no-color
      - name: Stop
        if: always()
        run: make down
